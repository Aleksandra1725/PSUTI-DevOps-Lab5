services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: kazan_events
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change-me
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kazan_events"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/nelkor/kazan-events:latest
    environment:
      PG_HOST: db
      PG_PORT: 5432
      PG_DB_NAME: kazan_events
      PG_USER_NAME: postgres
      PG_USER_PASSWORD: change-me
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: .
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pg_data: